name: JS/TS Apps

on:
  push:
    paths:
      - 'apps/calm-connect-landing/**'
      - 'services/allergen-coach/frontend/**'
      - 'apps/marketing-template/**'
  pull_request:
    paths:
      - 'apps/calm-connect-landing/**'
      - 'services/allergen-coach/frontend/**'
      - 'apps/marketing-template/**'
  workflow_dispatch:

jobs:
  build-calm-connect-landing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/calm-connect-landing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test || true

  build-allergen-coach-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/allergen-coach/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test || true

  build-marketing-template:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/marketing-template
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
