# Mirrably static demo: Playwright E2E (TASK-TRUE-PULSE-447) + optional Pages deploy.
# Deploy path (TASK-FAST-FLASH-137 / TASK-GRAND-SURGE-189): main only, after tests, requires CLOUDFLARE_API_TOKEN.
# Uses --with-deps so Chromium starts on clean Ubuntu runners (libasound, etc.).
name: Mirrably Demo CI

on:
  push:
    paths:
      - 'apps/mirrably-demo/**'
      - '.github/workflows/mirrably-demo-e2e.yml'
  pull_request:
    paths:
      - 'apps/mirrably-demo/**'
      - '.github/workflows/mirrably-demo-e2e.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mirrably-demo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/mirrably-demo/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium + system deps
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mirrably-demo-playwright-report
          path: apps/mirrably-demo/playwright-report/
          retention-days: 7

  # Publish only static assets (not e2e/, package.json, etc.).
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: [test]
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      secrets.CLOUDFLARE_API_TOKEN != ''
    steps:
      - uses: actions/checkout@v4

      - name: Stage static assets
        run: |
          mkdir -p /tmp/mirrably-demo-pages
          cp apps/mirrably-demo/index.html apps/mirrably-demo/_headers /tmp/mirrably-demo-pages/

      - name: Pages deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy /tmp/mirrably-demo-pages --project-name=mirrably-demo
