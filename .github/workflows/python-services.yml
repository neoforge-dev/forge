name: Python Services

on:
  push:
    paths:
      - 'services/interview-simulator/**'
      - 'services/allergen-coach/**'
  pull_request:
    paths:
      - 'services/interview-simulator/**'
      - 'services/allergen-coach/**'
  workflow_dispatch:

jobs:
  test-allergen-coach:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/allergen-coach/backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest --tb=short -q

  test-interview-simulator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/interview-simulator/backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest --tb=short -q
