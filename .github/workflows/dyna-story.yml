# DynaStory — Swift Package build + unit tests (macOS only).
# Requires Xcode with Swift 6.2+ and iOS 26 / macOS 26 SDKs (FoundationModels).
# Linux agents cannot compile this target; CI is the canonical verification path.
name: DynaStory

on:
  push:
    paths:
      - 'apps/dyna-story/**'
      - '.github/workflows/dyna-story.yml'
  pull_request:
    paths:
      - 'apps/dyna-story/**'
      - '.github/workflows/dyna-story.yml'
  workflow_dispatch:

concurrency:
  group: dyna-story-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/dyna-story
    steps:
      - uses: actions/checkout@v4

      - name: Swift toolchain
        run: swift --version

      - name: Build (SwiftPM)
        run: swift build -v

      - name: Unit tests (Swift Testing)
        run: swift test -v
