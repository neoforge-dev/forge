name: forge-tryon CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/forge-tryon/**'
      - 'apps/forge-tryon-api/**'
      - 'apps/forge-tryon-assistant/**'
  pull_request:
    paths:
      - 'apps/forge-tryon/**'
      - 'apps/forge-tryon-api/**'
      - 'apps/forge-tryon-assistant/**'

jobs:
  widget:
    name: Widget (TypeScript + Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/forge-tryon
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/forge-tryon/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  api:
    name: API (Python + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/forge-tryon-api
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: 'latest'

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest --tb=short -q

  assistant:
    name: Assistant (Next.js build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/forge-tryon-assistant
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/forge-tryon-assistant/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        # package.json already runs: env -u NODE_ENV next build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [widget]
    defaults:
      run:
        working-directory: apps/forge-tryon
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/forge-tryon/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/forge-tryon/playwright-report/
          retention-days: 7
