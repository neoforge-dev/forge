name: Voice Coach Elixir CI

on:
  push:
    paths:
      - 'services/voice_coach_elixir/**'
  pull_request:
    paths:
      - 'services/voice_coach_elixir/**'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: voice_coach_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/voice_coach_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.16'
          otp-version: '26'

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            services/voice_coach_elixir/deps
            services/voice_coach_elixir/_build
          key: elixir-${{ runner.os }}-${{ hashFiles('services/voice_coach_elixir/mix.lock') }}

      - name: Install deps
        working-directory: services/voice_coach_elixir
        run: mix deps.get

      - name: Compile
        working-directory: services/voice_coach_elixir
        run: mix compile --warnings-as-errors

      - name: Setup DB
        working-directory: services/voice_coach_elixir
        run: mix ecto.create && mix ecto.migrate

      - name: Run tests
        working-directory: services/voice_coach_elixir
        run: mix test
