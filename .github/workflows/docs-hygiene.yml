name: Docs Hygiene

on:
  pull_request:
    paths:
      - "README.md"
      - "AGENTS.md"
      - "docs/**"
      - "scripts/check_active_surface_policy.py"
      - "scripts/tests/test_active_surface_policy.py"
      - ".github/workflows/docs-hygiene.yml"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "AGENTS.md"
      - "docs/**"
      - "scripts/check_active_surface_policy.py"
      - "scripts/tests/test_active_surface_policy.py"
      - ".github/workflows/docs-hygiene.yml"

jobs:
  docs-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check active surface policy
        run: python3 scripts/check_active_surface_policy.py
      - name: Check public release boundary
        run: python3 scripts/check_public_release_boundary.py
      - name: Test policy checker
        run: python3 -m unittest scripts.tests.test_active_surface_policy scripts.tests.test_public_release_boundary
