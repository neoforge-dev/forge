[project]
name = "forge-harness"
version = "1.0.0"
description = "FORGE iOS Development Automation Harness"
readme = "CLAUDE.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "FORGE Team" }
]

dependencies = [
    "click>=8.1.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
]

[project.scripts]
forge-ios = "forge_harness.cli_v2:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=forge_harness --cov-report=term-missing"
markers = [
    "integration: marks tests as integration tests (requires xcodebuild/xcodegen)",
    "slow: marks tests as slow (may take >30 seconds)",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "F841",
    "F401",
    "N806",
    "E402",
    "F811",
    "E741",
]
