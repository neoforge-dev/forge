# MVP Launch Pipeline
# ====================
# Full MVP launch sequence with quality gates
#
# Usage:
#   pipeline = orchestrator.load_pipeline_from_yaml("pipelines/mvp_launch.yaml")
#   result = await orchestrator.execute(pipeline, context={
#       "domain": "codeswiftr-com",
#       "project": "interview-simulator",
#       "project_dir": "/path/to/project",
#       "dry_run": false
#   })

name: mvp_launch
description: Full MVP launch sequence with quality gates
version: "1.0.0"

context:
  # Required
  domain: null
  project: null
  project_dir: null
  # Optional
  dry_run: false

steps:
  - name: preflight
    harness: preflight
    method: run_checks
    description: Run pre-flight checks
    inputs:
      domain: "{{ context.domain }}"
    outputs:
      - passed
      - warnings
    on_failure: abort

  - name: quality_gates
    harness: deployment
    method: check_quality_gates
    description: Verify quality gates (tests, coverage, linting)
    inputs:
      project_dir: "{{ context.project_dir }}"
    outputs:
      - coverage
      - tests_passed
    on_failure: abort

  - name: deploy
    harness: deployment
    method: full_deploy
    description: Deploy to production
    inputs:
      project_dir: "{{ context.project_dir }}"
      dry_run: "{{ context.dry_run }}"
    outputs:
      - backend_url
      - frontend_url
    on_failure: abort
    timeout_seconds: 1800  # 30 minutes

  - name: smoke_tests
    harness: deployment
    method: run_smoke_tests
    description: Run smoke tests against deployed services
    inputs:
      backend_url: "{{ steps.deploy.backend_url }}"
      frontend_url: "{{ steps.deploy.frontend_url }}"
    outputs:
      - all_passed
    on_failure: human_gate
    timeout_seconds: 300

  - name: create_dashboard
    harness: analytics
    method: create_mvp_dashboard
    description: Create analytics dashboard
    inputs:
      domain: "{{ context.domain }}"
      project: "{{ context.project }}"
    outputs:
      - dashboard_id
      - dashboard_url
    on_failure: skip

human_gates:
  smoke_failure:
    timeout_hours: 4
    notification_channels:
      - slack
      - email
    on_timeout: abort
    message: "Smoke tests failed. Please investigate and approve to continue or abort."
