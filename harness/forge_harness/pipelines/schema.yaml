# Pipeline YAML Schema Definition
# ================================
# This file documents the YAML schema for FORGE orchestration pipelines.
#
# Pipelines can be defined in YAML files and loaded using:
#   orchestrator.load_pipeline_from_yaml(path)
#
# Template Variables:
#   {{ context.key }}        - Access pipeline context values
#   {{ steps.name.key }}     - Access outputs from previous steps

# Root schema
$schema: http://json-schema.org/draft-07/schema#
title: FORGE Pipeline Definition
type: object
required:
  - name
  - steps
additionalProperties: false

properties:
  # Pipeline metadata
  name:
    type: string
    description: Unique pipeline identifier
    pattern: "^[a-z][a-z0-9_]*$"

  description:
    type: string
    description: Human-readable pipeline description

  version:
    type: string
    description: Pipeline version (semver format)
    default: "1.0.0"

  # Initial context values
  context:
    type: object
    description: Initial context values available to all steps
    additionalProperties: true

  # Pipeline steps
  steps:
    type: array
    description: Ordered list of pipeline steps
    minItems: 1
    items:
      $ref: "#/definitions/step"

  # Human gate configurations
  human_gates:
    type: object
    description: Named human gate configurations
    additionalProperties:
      $ref: "#/definitions/human_gate"

definitions:
  step:
    type: object
    required:
      - name
      - harness
      - method
    additionalProperties: false
    properties:
      name:
        type: string
        description: Unique step identifier within the pipeline
        pattern: "^[a-z][a-z0-9_]*$"

      harness:
        type: string
        description: Harness to invoke (content, notion, growth, deployment, etc.)

      method:
        type: string
        description: Method to call on the harness

      description:
        type: string
        description: Human-readable step description

      inputs:
        type: object
        description: Input parameters (supports {{ template }} syntax)
        additionalProperties: true

      outputs:
        type: array
        description: Output keys to capture in context
        items:
          type: string

      on_failure:
        type: string
        description: Action on failure
        enum:
          - abort     # Stop pipeline immediately
          - retry     # Retry with exponential backoff
          - skip      # Log error and continue
          - human_gate  # Pause for human intervention
        default: abort

      retry_count:
        type: integer
        description: Max retry attempts (only if on_failure=retry)
        minimum: 1
        maximum: 10
        default: 3

      timeout_seconds:
        type: integer
        description: Max execution time in seconds
        minimum: 1
        maximum: 604800  # 7 days
        default: 600

  human_gate:
    type: object
    additionalProperties: false
    properties:
      timeout_hours:
        type: number
        description: Hours to wait for human response
        minimum: 0.1
        maximum: 168  # 7 days
        default: 24

      notification_channels:
        type: array
        description: Channels to notify (slack, email, github_issue)
        items:
          type: string
          enum:
            - slack
            - email
            - github_issue
            - notion_comment
        default:
          - slack

      on_timeout:
        type: string
        description: Action if no human response
        enum:
          - skip      # Continue without approval
          - abort     # Stop pipeline
          - escalate  # Notify additional channels
        default: skip

      message:
        type: string
        description: Custom message to show to human
