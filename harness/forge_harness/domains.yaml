# FORGE Domain Registry
# =====================
# Single source of truth for all 10 FORGE portfolio domains.
# Used by DomainRegistry class to provide domain configuration everywhere.
#
# Schema:
#   key: domain-slug (matches directory name)
#   display_name: Human-readable name
#   compliance: List of compliance requirements (COPPA, HIPAA-lite, GDPR)
#   human_gates: Actions requiring human review
#   frontend_tier: React | Lit PWA | React Native
#   localization: ISO language code or null
#   special_rules: Domain-specific configuration
#   content: Content generation settings
#   deployment: Railway/Cloudflare targets
#   notion: Notion database IDs
#   products: List of products in this domain
#   active: Whether domain is actively developed

